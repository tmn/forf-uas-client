[project]
name = "forf-uas"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.13.2",
    "fastapi[standard]>=0.135.1",
    "paho-mqtt>=2.1.0",
]

[dependency-groups]
dev = [
    "aioresponses>=0.7.8",
    "pytest>=8.4.2",
    "pytest-asyncio>=0.24.0",
]

[tool.uv.sources]
api = { workspace = true }
broker = { workspace = true }

[tool.uv.workspace]
members = [
  "api",
  "broker"
]

[tool.pyrefly]
project-include = ["**/*.py*"]

