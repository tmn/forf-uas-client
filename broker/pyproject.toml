[project]
name = "broker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "paho-mqtt",
    "aiohttp",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "aioresponses",
]

[project.scripts]
service = "broker:run.main"

[tool.pyrefly]
project-include = ["**/*.py*"]

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"


